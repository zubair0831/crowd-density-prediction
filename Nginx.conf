# ═══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Crowd Intelligence System  v3.2
# Serves the static frontend and reverse-proxies:
#   /api/*  →  FastAPI HTTP endpoints
#   /ws     →  FastAPI WebSocket endpoint
# ═══════════════════════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;   # allow large frame uploads

    # Upstream backend (service name from docker-compose)
    upstream backend {
        server backend:8000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # ── Static frontend ───────────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── REST API proxy ────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── WebSocket proxy ───────────────────────────────────────────────────
        location /ws {
            proxy_pass         http://backend/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;   # keep WS alive for long sessions
        }
    }
}